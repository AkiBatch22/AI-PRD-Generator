name: CI and container delivery

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish images after checks (default branch only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  LLM_PROVIDER: mock
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: copilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - name: Test SQLite
        working-directory: backend
        run: python -m pytest -q
      - name: Test PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://copilot:ci-only-password@localhost:5432/copilot_test
        run: python -m pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  containers:
    name: Container smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the stack
        run: docker compose up --detach --build --wait --wait-timeout 180
      - name: Verify the complete workflow through the frontend proxy
        run: python scripts/smoke.py
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Remove this CI run's containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  publish:
    name: Publish versioned images
    needs: [backend, frontend, containers]
    if: >-
      (github.event_name == 'push' &&
        (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
         startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build release images from the checked source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag && ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Use a version tag such as v1.0.0 or v1.0.0-rc.1.' >&2
            exit 1
          fi
          repository="${GITHUB_REPOSITORY,,}"
          for component in backend frontend; do
            image="ghcr.io/${repository}-${component}"
            docker build --pull \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --tag "${image}:sha-${GITHUB_SHA}" "${component}"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              docker tag "${image}:sha-${GITHUB_SHA}" "${image}:${GITHUB_REF_NAME}"
            fi
          done
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish images and record image references
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          for component in backend frontend; do
            image="ghcr.io/${repository}-${component}"
            docker push "${image}:sha-${GITHUB_SHA}"
            printf '%s\n' "${image}:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              docker push "${image}:${GITHUB_REF_NAME}"
              printf '%s\n' "${image}:${GITHUB_REF_NAME}" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - name: Clear registry credentials
        if: always()
        run: docker logout ghcr.io
